<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tracker de Victorias / Derrotas</title>
    <style>
      /* -------- Paleta & base -------- */
      :root {
        --bg: #0e1017;
        --panel: #1c1f26;
        --accent: #f0b90b;
        --text: #eef1f6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 1rem;
        gap: 2rem;
      }

      h1 {
        margin: 0;
        font-size: 2rem;
        text-align: center;
      }

      /* -------- Secciones por campeón -------- */

      .champ-section {
        width: 100%;
        max-width: 900px;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .player-wrapper,
      .controls,
      .panel {
        background: var(--panel);
        border-radius: 12px;
        padding: 1rem;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
      }

      .player {
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      .player img {
        width: 72px;
        height: 72px;
        border-radius: 12px;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: center;
        justify-content: center;
      }

      select,
      button {
        padding: 0.6rem 1rem;
        font-size: 1rem;
        border: none;
        border-radius: 8px;
      }

      select {
        background: var(--panel);
        color: var(--text);
      }

      button {
        cursor: pointer;
        background: var(--accent);
        color: #000;
        font-weight: 600;
        transition: filter 0.2s ease;
      }

      button:hover {
        filter: brightness(1.1);
      }

      .results-wrapper {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 1rem;
      }

      .panel h2 {
        margin-top: 0;
        font-size: 1.2rem;
        text-align: center;
      }

      .champion {
        position: relative;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
        padding-right: 30px; /* Espacio para el botón de eliminar */
      }

      .champion img {
        width: 40px;
        height: 40px;
        border-radius: 6px;
      }

      .counter {
        background: var(--accent);
        color: #000;
        padding: 0 6px;
        border-radius: 6px;
        font-weight: 700;
        font-size: 0.9rem;
      }

      .delete-btn {
        position: absolute;
        right: 0;
        background: transparent;
        color: #ff5555;
        border: none;
        font-size: 1.2rem;
        padding: 0;
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0.6;
        transition: opacity 0.2s ease;
        cursor: pointer;
      }

      .delete-btn:hover {
        opacity: 1;
        background: transparent;
        filter: none;
      }

      /* Separador visual entre secciones */
      hr {
        width: 60%;
        border: 0;
        border-top: 2px dashed #444;
      }

      .data-controls {
        display: flex;
        justify-content: center;
        gap: 1rem;
        margin-bottom: 2rem;
      }

      .btn-data {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--accent);
        cursor: pointer;
        padding: 0.6rem 1rem;
        font-size: 1rem;
        border-radius: 8px;
        transition: all 0.2s ease;
      }

      .btn-data:hover {
        background: var(--accent);
        color: #000;
      }

      .username-container {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 0.5rem;
      }

      .username-input {
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--accent);
        padding: 0.3rem 0.5rem;
        border-radius: 4px;
        font-size: 0.9rem;
      }

      .save-username-btn {
        padding: 0.3rem 0.5rem;
        font-size: 0.9rem;
      }

      /* Estilos para el modal de cambio de campeón */
      .champion-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.8);
        z-index: 1000;
        overflow: hidden;
      }

      .champion-modal.show {
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      .modal-content {
        background-color: var(--bg);
        margin: 5vh auto;
        padding: 20px;
        border: 1px solid var(--accent);
        width: 90%;
        max-width: 800px;
        border-radius: 8px;
        max-height: 90vh;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: var(--accent) var(--panel);
      }

      /* Estilizar scrollbar para navegadores webkit (Chrome, Safari, etc.) */
      .modal-content::-webkit-scrollbar {
        width: 8px;
      }

      .modal-content::-webkit-scrollbar-track {
        background: var(--panel);
        border-radius: 4px;
      }

      .modal-content::-webkit-scrollbar-thumb {
        background-color: var(--accent);
        border-radius: 4px;
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        border-bottom: 1px solid var(--accent);
        padding-bottom: 10px;
      }

      .modal-close {
        background: transparent;
        border: none;
        color: var(--text);
        font-size: 28px;
        cursor: pointer;
      }

      .champions-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
        gap: 10px;
      }

      .champion-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 5px;
        border-radius: 5px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .champion-item:hover {
        background-color: var(--panel);
        transform: scale(1.05);
      }

      .champion-item.current {
        border: 2px solid var(--accent);
      }

      .champion-item img {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        object-fit: cover;
      }

      .champion-item span {
        margin-top: 5px;
        font-size: 0.8rem;
        text-align: center;
      }

      /* Estilos responsivos */
      @media (max-width: 600px) {
        .champions-grid {
          grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
        }
        
        .champion-item img {
          width: 50px;
          height: 50px;
        }
        
        .champion-item span {
          font-size: 0.7rem;
        }
      }

      .player-img.champion-change-trigger {
        transition: transform 0.2s ease;
      }

      .player-img.champion-change-trigger:hover {
        transform: scale(1.05);
        box-shadow: 0 0 10px var(--accent);
      }

      /* Estilizar scrollbar para toda la aplicación */
      ::-webkit-scrollbar {
        width: 10px;
      }

      ::-webkit-scrollbar-track {
        background: var(--bg);
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb {
        background-color: var(--accent);
        border-radius: 4px;
        border: 2px solid var(--bg);
      }

      ::-webkit-scrollbar-thumb:hover {
        background-color: #d9a60a;
      }

      /* Prevenir scroll cuando el modal está abierto */
      body.modal-open {
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <h1>Tracker de Victorias / Derrotas</h1>
    <main id="app"></main>

    <script>
      /* =============================================================
       *  Constantes y variables globales
       * ===========================================================*/
      const STORAGE_KEY = "lolTrackerData";
      let savedData = {}; // se sincroniza con localStorage

      let ddragonVersion = "14.8.1"; // fallback en caso de error
      let championsData = {};
      const players = {}; // { JarvanIV: {wins: {}, losses: {}, winsList, lossesList} }

      /** Devuelve URL a icono del campeón */
      const championImgUrl = (id) =>
        `https://ddragon.leagueoflegends.com/cdn/${ddragonVersion}/img/champion/${id}.png`;

      /* =============================================================
       *  Persistencia en localStorage
       * ===========================================================*/

      const loadSavedData = () => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : {};
        } catch (e) {
          console.error("Error al leer localStorage", e);
          return {};
        }
      };

      const saveData = () => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(savedData));
        } catch (e) {
          console.error("No se pudo guardar en localStorage", e);
        }
      };

      /* =============================================================
       *  Utilidades de Data Dragon
       * ===========================================================*/

      async function loadChampions() {
        try {
          const versionsRes = await fetch(
            "https://ddragon.leagueoflegends.com/api/versions.json"
          );
          const versions = await versionsRes.json();
          ddragonVersion = versions[0];

          const champsRes = await fetch(
            `https://ddragon.leagueoflegends.com/cdn/${ddragonVersion}/data/en_US/champion.json`
          );
          const champs = await champsRes.json();
          championsData = champs.data;
        } catch (err) {
          console.error("No se pudo obtener Data Dragon:", err);
        }
      }

      /* =============================================================
       *  Construcción dinámica de secciones por jugador
       * ===========================================================*/

      function createPlayerSection(playerId, highlight = false, defaultUsername = "") {
        const champName = championsData[playerId]?.name ?? playerId;
        const app = document.getElementById("app");
        
        // Obtener el nombre de usuario guardado o usar el predeterminado
        const savedUsername = savedData[playerId]?.username || defaultUsername;

        // --- Estructura base ------------------------------------
        const section = document.createElement("section");
        section.className = "champ-section";
        section.innerHTML = `
          <div class="player-wrapper">
            <div class="player">
              <img class="player-img champion-change-trigger" src="${championImgUrl(playerId)}" alt="${champName}" title="Haz clic para cambiar de campeón">
              <div>
                <strong class="player-name">${champName}</strong>
                <div class="username-container">
                  <span>Usuario: </span>
                  <strong class="username-display">${savedUsername}</strong>
                </div>
              </div>
            </div>
          </div>

          <div class="controls">
            <label>Elegí un campeón rival:</label>
            <select class="champ-select"></select>
            <button class="btn-win">Agregar Victoria</button>
            <button class="btn-loss">Agregar Derrota</button>
          </div>

          <div class="results-wrapper">
            <div class="panel">
              <h2>Campeones que venciste</h2>
              <div class="wins-list"></div>
            </div>
            <div class="panel">
              <h2>Campeones que te vencieron</h2>
              <div class="losses-list"></div>
            </div>
          </div>
        `;

        app.appendChild(section);

        // --- Referencias DOM ------------------------------------
        const select = section.querySelector(".champ-select");
        const btnWin = section.querySelector(".btn-win");
        const btnLoss = section.querySelector(".btn-loss");
        const winsList = section.querySelector(".wins-list");
        const lossesList = section.querySelector(".losses-list");
        const championImg = section.querySelector(".champion-change-trigger");

        // Rellenar selector con todos los campeones
        Object.values(championsData).forEach((champ) => {
          const option = document.createElement("option");
          option.value = champ.id;
          option.textContent = champ.name;
          select.appendChild(option);
        });
        
        // --- Estado y restauración --------------------------------
        const storageKey = `${defaultUsername}:${playerId}`;
        const initial = savedData[storageKey] ?? { wins: {}, losses: {}, username: savedUsername };
        players[playerId] = {
          wins: { ...initial.wins },
          losses: { ...initial.losses },
          username: initial.username || savedUsername,
          winsList,
          lossesList,
        };

        // Guardar el nombre de usuario en los datos persistentes
        if (!savedData[storageKey]) {
          savedData[storageKey] = { wins: {}, losses: {}, username: savedUsername };
          saveData();
        } else if (!savedData[storageKey].username) {
          savedData[storageKey].username = savedUsername;
          saveData();
        }

        // Listener para abrir el modal al hacer clic en la imagen
        championImg.addEventListener("click", () => {
          console.log(`Abriendo modal para: ${playerId}`);
          openChampionModal(playerId);
        });
        
        // Agregar cursor pointer y efecto visual
        championImg.style.cursor = "pointer";

        // Renderizar elementos guardados
        const renderCounters = (map, listEl, playerId, type) => {
          Object.entries(map).forEach(([champId, count]) => {
            const champName = championsData[champId]?.name ?? champId;
            const wrapper = document.createElement("div");
            wrapper.className = "champion";
            wrapper.dataset.id = champId;
            wrapper.innerHTML = `
              <img src="${championImgUrl(champId)}" alt="${champName}">
              <span>${champName}</span>
              <span class="counter">${count}</span>
              <button class="delete-btn" title="Eliminar" aria-label="Eliminar resultado">×</button>
            `;
            
            // Agregar listener al botón de eliminar
            const deleteBtn = wrapper.querySelector(".delete-btn");
            deleteBtn.addEventListener("click", () => {
              deleteResult(playerId, type, champId);
            });
            
            listEl.appendChild(wrapper);
          });
        };

        renderCounters(players[playerId].wins, winsList, playerId, "win");
        renderCounters(players[playerId].losses, lossesList, playerId, "loss");

        // Listeners para nuevos resultados
        btnWin.addEventListener("click", () =>
          addResult(playerId, "win", select.value)
        );
        btnLoss.addEventListener("click", () =>
          addResult(playerId, "loss", select.value)
        );
      }

      function addResult(playerId, type, champId) {
        const store = players[playerId];
        const map = type === "win" ? store.wins : store.losses;
        const list = type === "win" ? store.winsList : store.lossesList;
        const champName = championsData[champId].name;

        if (map[champId]) {
          map[champId] += 1;
          const counter = list.querySelector(
            `.champion[data-id="${champId}"] .counter`
          );
          counter.textContent = map[champId];
        } else {
          map[champId] = 1;
          const wrapper = document.createElement("div");
          wrapper.className = "champion";
          wrapper.dataset.id = champId;
          wrapper.innerHTML = `
            <img src="${championImgUrl(champId)}" alt="${champName}">
            <span>${champName}</span>
            <span class="counter">1</span>
            <button class="delete-btn" title="Eliminar" aria-label="Eliminar resultado">×</button>
          `;
          
          // Agregar listener al botón de eliminar
          const deleteBtn = wrapper.querySelector(".delete-btn");
          deleteBtn.addEventListener("click", () => {
            deleteResult(playerId, type, champId);
          });
          
          list.appendChild(wrapper);
        }

        // Actualizar estructura persistida y guardar
        const storageKey = `${players[playerId].username}:${playerId}`;
        if (!savedData[storageKey]) savedData[storageKey] = { wins: {}, losses: {} };
        savedData[storageKey][type === "win" ? "wins" : "losses"][champId] =
          map[champId];
        saveData();
      }

      function deleteResult(playerId, type, champId) {
        const store = players[playerId];
        const map = type === "win" ? store.wins : store.losses;
        const list = type === "win" ? store.winsList : store.lossesList;
        
        // Reducir el contador en 1
        if (map[champId] > 1) {
          // Si hay más de 1, solo reducimos el contador
          map[champId] -= 1;
          
          // Actualizar el contador en el DOM
          const counter = list.querySelector(
            `.champion[data-id="${champId}"] .counter`
          );
          counter.textContent = map[champId];
        } else {
          // Si solo hay 1, eliminamos completamente la entrada
          delete map[champId];
          
          // Eliminar del DOM
          const element = list.querySelector(`.champion[data-id="${champId}"]`);
          if (element) {
            element.remove();
          }
        }
        
        // Actualizar estructura persistida y guardar
        const storageKey = `${players[playerId].username}:${playerId}`;
        if (!savedData[storageKey]) savedData[storageKey] = { wins: {}, losses: {} };
        
        if (map[champId]) {
          // Actualizar el contador en los datos guardados
          savedData[storageKey][type === "win" ? "wins" : "losses"][champId] = map[champId];
        } else {
          // Eliminar la entrada si el contador llegó a 0
          delete savedData[storageKey][type === "win" ? "wins" : "losses"][champId];
        }
        
        saveData();
      }

      /* =============================================================
       *  Exportación e importación de datos
       * ===========================================================*/

      function exportData() {
        // Crear un objeto Blob con los datos
        const dataStr = JSON.stringify(savedData, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        
        // Crear un URL para el blob
        const url = URL.createObjectURL(blob);
        
        // Crear un elemento <a> para descargar el archivo
        const a = document.createElement('a');
        a.href = url;
        a.download = `lol-tracker-data-${new Date().toISOString().slice(0, 10)}.json`;
        
        // Simular un clic en el enlace para iniciar la descarga
        document.body.appendChild(a);
        a.click();
        
        // Limpiar
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 0);
      }

      function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        
        reader.onload = function(e) {
          try {
            const importedData = JSON.parse(e.target.result);
            
            // Validar que el formato sea correcto
            if (typeof importedData !== 'object') {
              throw new Error('Formato de archivo inválido');
            }
            
            // Actualizar los datos
            savedData = importedData;
            saveData();
            
            // Recargar la página para mostrar los datos importados
            alert('Datos importados correctamente. La página se recargará.');
            location.reload();
          } catch (error) {
            alert(`Error al importar datos: ${error.message}`);
          }
        };
        
        reader.readAsText(file);
      }

      /* =============================================================
       *  Modal para cambio de campeón
       * ===========================================================*/

      // Crear el modal una sola vez en el documento
      function createChampionModal() {
        // Verificar si ya existe
        if (document.getElementById('champion-modal')) return;
        
        const modal = document.createElement('div');
        modal.id = 'champion-modal';
        modal.className = 'champion-modal';
        modal.innerHTML = `
          <div class="modal-content">
            <div class="modal-header">
              <h2>Selecciona un nuevo campeón</h2>
              <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
              <div class="champions-grid"></div>
            </div>
          </div>
        `;
        
        document.body.appendChild(modal);
        
        // Cerrar modal al hacer clic en la X o fuera del contenido
        const closeBtn = modal.querySelector('.modal-close');
        closeBtn.addEventListener('click', () => {
          closeModal(modal);
        });
        
        modal.addEventListener('click', (e) => {
          if (e.target === modal) {
            closeModal(modal);
          }
        });
      }

      // Función para abrir el modal con los campeones
      function openChampionModal(currentPlayerId) {
        createChampionModal();
        
        const modal = document.getElementById('champion-modal');
        const grid = modal.querySelector('.champions-grid');
        
        // Limpiar grid
        grid.innerHTML = '';
        
        // Llenar grid con imágenes de campeones
        Object.values(championsData).forEach(champ => {
          const champDiv = document.createElement('div');
          champDiv.className = 'champion-item';
          if (champ.id === currentPlayerId) {
            champDiv.classList.add('current');
          }
          
          champDiv.innerHTML = `
            <img src="${championImgUrl(champ.id)}" alt="${champ.name}">
            <span>${champ.name}</span>
          `;
          
          // Evento para seleccionar campeón
          champDiv.addEventListener('click', () => {
            if (champ.id !== currentPlayerId) {
              console.log(`Seleccionado: ${champ.id} (${champ.name})`);
              changePlayerChampion(currentPlayerId, champ.id, players[currentPlayerId].username);
            }
          });
          
          grid.appendChild(champDiv);
        });
        
        // Mostrar modal y bloquear scroll del body
        modal.classList.add('show');
        document.body.classList.add('modal-open');
      }

      // Función para cerrar el modal
      function closeModal(modal) {
        modal.classList.remove('show');
        document.body.classList.remove('modal-open');
      }

      /* =============================================================
       *  Gestión del campeón activo
       * ===========================================================*/

      // Guardar el último campeón seleccionado como activo
      function setActiveChampion(championId, username) {
        localStorage.setItem(`${username}:activeChampion`, championId);
      }

      // Obtener el campeón activo
      function getActiveChampion(username) {
        return localStorage.getItem(`${username}:activeChampion`) || 'JarvanIV'; // Default
      }

      // Modificar la función changePlayerChampion
      function changePlayerChampion(oldPlayerId, newChampId, username) {
        // Verificar si el nuevo campeón ya existe como jugador
        console.log(`Verificando si existe un jugador usando actualmente el campeón ${newChampId}`);
        
        // Comprobar si el campeón ya está en uso por algún usuario
        const otherUserActiveChamp = Object.keys(savedData).find(key => {
          // Verificar si la clave corresponde a este campeón y no es el jugador actual
          return key === newChampId && savedData[key].username !== username;
        });
        
        if (otherUserActiveChamp) {
          alert(`Ya existe un jugador con el campeón ${championsData[newChampId].name}`);
          return false;
        }
        
        // Obtener los datos del jugador anterior
        const userData = savedData[oldPlayerId];
        if (!userData) {
          console.error("No se encontraron datos para el jugador:", oldPlayerId);
          alert("Error al cambiar de campeón. No se encontraron datos del jugador actual.");
          return false;
        }
        
        const newChampName = championsData[newChampId].name;
        console.log(`Cambiando de ${oldPlayerId} a ${newChampId} (${newChampName})`);
        
        // Crear entrada para el nuevo campeón con formato ${usuario}:${campeon}
        const newStorageKey = `${username}:${newChampId}`;
        savedData[newChampId] = {
          wins: { ...userData.wins },
          losses: { ...userData.losses },
          username: username
        };
        
        // Eliminar la entrada del campeón anterior
        delete savedData[oldPlayerId];
        
        // Establecer el nuevo campeón como activo
        setActiveChampion(newChampId, username);
        
        // Guardar cambios
        console.log("Datos actualizados:", savedData);
        saveData();
        
        // Mostrar mensaje antes de recargar
        alert(`Cambiando a ${newChampName}. La página se recargará para aplicar los cambios.`);
        
        // Recargar la página para aplicar los cambios
        location.reload();
        
        return true;
      }

      /* =============================================================
       *  Inicialización global
       * ===========================================================*/

      document.addEventListener("DOMContentLoaded", async () => {
        savedData = loadSavedData();
        await loadChampions();
        
        // Agregar controles de datos antes del contenido principal
        const app = document.getElementById("app");
        const dataControls = document.createElement("div");
        dataControls.className = "data-controls";
        dataControls.innerHTML = `
          <button id="btn-export" class="btn-data">Exportar Datos</button>
          <label for="file-import" class="btn-data">Importar Datos</label>
          <input type="file" id="file-import" accept=".json" style="display: none;">
        `;
        app.appendChild(dataControls);
        
        // Agregar event listeners para exportar/importar
        document.getElementById("btn-export").addEventListener("click", exportData);
        document.getElementById("file-import").addEventListener("change", importData);
        
        createPlayerSection(getActiveChampion("CLON"), true, "CLON"); // Main con usuario predeterminado "CLON"
        
        // Separador visual
        const hr = document.createElement("hr");
        app.appendChild(hr);
        
        createPlayerSection(getActiveChampion("TIO"), false, "TIO"); // Secundario con usuario predeterminado "TIO"
      });
    </script>
  </body>
</html>
